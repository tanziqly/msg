services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: msgco-web:latest
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_RECIPIENT_IDS: ${TELEGRAM_RECIPIENT_IDS:?TELEGRAM_RECIPIENT_IDS is required}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    image: msgco-bot:latest
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
